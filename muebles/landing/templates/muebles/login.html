{% extends 'index.html' %}

{% block pages %}
    <li class="first" onclick='location.href="/{{URL}}";'>Portada</li>
    <li onclick='location.href="/{{URL}}portada";'>Portada</li>
{% endblock %}

{% block content %}

    {% if error %}
        <div>
                <h2 style="color: red;">¡Atención!</h2>
                <p>{{ error }}</p>
        </div>
    {% endif %}

	<h1 class ="portada-title" >Inicio de sesión: </h1>

	<form action="login" method="post" text-align="center" class="login">
		{% csrf_token %}
		<label for="email"><b>Email:</b></label>
		<input type="text" placeholder="Introduzca su email" name="email" required>

		<label for="psw"><b>Contraseña:</b></label>
		<input type="password" placeholder="Introduzca su contraseña" name="psw" required>
		<button class="button" type="submit">Login</button>

	</form>
{% endblock %}

{% endblock %}
